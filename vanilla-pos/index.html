<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyCafe POS System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    /* Mencegah layar HP bisa digeser ke samping secara tidak sengaja */
    body { background-color: #f8f9fa; overflow-x: hidden; }
    
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* =========================================
       1. DESAIN SIDEBAR DASAR (UNTUK LAPTOP)
    ========================================= */
    .sidebar { 
      width: 250px; 
      min-height: 100vh; 
      position: sticky; 
      top: 0; 
      transition: all 0.3s ease-in-out;
      z-index: 1040; 
    }
    
    .nav-link { color: rgba(255,255,255,0.7); border-radius: 10px; margin-bottom: 5px; transition: 0.2s; padding: 12px 15px; }
    .nav-link.active { background-color: #ffc107 !important; color: #000 !important; font-weight: bold; }
    .nav-link:hover:not(.active) { background-color: rgba(255,255,255,0.1); color: #fff; }
    
    .menu-card { transition: transform 0.2s; border: none; overflow: hidden; }
    .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
    .cart-badge { position: absolute; top: -8px; right: -8px; font-size: 0.8rem; padding: 5px 8px; }

    /* =========================================
       2. LOGIKA RESPONSIF (UNTUK IPAD & HP)
       Layar di bawah 992px (Tablet & Mobile)
    ========================================= */
    @media (max-width: 991.98px) {
      .sidebar {
        position: fixed;
        left: -260px; /* Sembunyikan sidebar sepenuhnya ke kiri */
        box-shadow: 5px 0 15px rgba(0,0,0,0.2);
      }
      .sidebar.active-mobile {
        left: 0; /* Munculkan saat tombol diklik */
      }
      /* Efek kaca gelap di latar belakang saat menu terbuka di HP/iPad */
      .sidebar-overlay {
        display: none;
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 1030;
      }
      .sidebar-overlay.active { display: block; }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="d-flex">
    
    <nav class="sidebar bg-dark text-white p-3" id="sidebar">
      <div class="d-flex align-items-center mb-4 mt-2 px-3">
        <i class="bi bi-cup-hot-fill fs-1 text-warning me-3"></i>
        <div>
          <h5 class="mb-0 fw-bold fs-4">MyCafe</h5>
          <small class="text-white-50">Admin POS</small>
        </div>
      </div>
      <ul class="nav flex-column px-2 gap-1">
        <li class="nav-item"><a class="nav-link active" href="#dashboard"><i class="bi bi-speedometer2 me-2 fs-5"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#menu"><i class="bi bi-grid-fill me-2 fs-5"></i> Kasir / Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="#orders"><i class="bi bi-receipt me-2 fs-5"></i> Pesanan Aktif</a></li>
        <li class="nav-item"><a class="nav-link" href="#tables"><i class="bi bi-layers-half me-2 fs-5"></i> Setting Meja</a></li>
      </ul>
    </nav>

    <main class="flex-grow-1 p-3 p-md-4 w-100 vh-100 overflow-auto">
      
      <div class="d-flex justify-content-between align-items-center mb-4 d-lg-none border-bottom pb-3">
        <div class="d-flex align-items-center">
          <button class="btn btn-dark me-3 rounded-3" id="btnToggleSidebar">
            <i class="bi bi-list fs-3"></i>
          </button>
          <h4 class="mb-0 fw-bold text-warning">MyCafe</h4>
        </div>
        <button class="btn btn-warning fw-bold position-relative d-md-none" onclick="document.getElementById('btnOpenCart').click()">
          <i class="bi bi-cart3 fs-4"></i> <span class="badge rounded-pill bg-danger cart-badge" id="cart-count-mobile">0</span>
        </button>
      </div>
      
      <section id="dashboard" class="view-section active">
        <h3 class="fw-bold mb-4 d-none d-lg-block">Dashboard</h3>
        <div class="row g-3 g-md-4 mb-4">
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-3 bg-white h-100">
              <div class="d-flex align-items-center">
                <div class="p-3 bg-primary bg-opacity-10 rounded-4 me-3"><i class="bi bi-grid-fill text-primary fs-2"></i></div>
                <div><h6 class="text-muted mb-0">Total Menu</h6><h2 class="fw-bold mb-0" id="total-menu">0</h2></div>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-3 bg-white h-100">
              <div class="d-flex align-items-center">
                <div class="p-3 bg-success bg-opacity-10 rounded-4 me-3"><i class="bi bi-layers-half text-success fs-2"></i></div>
                <div><h6 class="text-muted mb-0">Total Meja</h6><h2 class="fw-bold mb-0" id="total-tables">0</h2></div>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-12 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-3 bg-white h-100">
              <div class="d-flex align-items-center">
                <div class="p-3 bg-warning bg-opacity-10 rounded-4 me-3"><i class="bi bi-receipt text-warning fs-2"></i></div>
                <div><h6 class="text-muted mb-0">Pesanan Pending</h6><h2 class="fw-bold mb-0" id="active-orders">0</h2></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="menu" class="view-section">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
          <h3 class="fw-bold mb-0 d-none d-lg-block"><i class="bi bi-grid-fill text-warning me-2"></i> Pilih Menu</h3>
          <div class="d-flex gap-2 w-100 w-md-auto">
            <button class="btn btn-outline-dark fw-bold flex-grow-1 py-2" data-bs-toggle="modal" data-bs-target="#addMenuModal">
              <i class="bi bi-plus-lg"></i> Tambah Menu
            </button>
            <button class="btn btn-warning fw-bold position-relative flex-grow-1 py-2 d-none d-md-block" id="btnOpenCart">
              <i class="bi bi-cart3 me-1"></i> Lihat Keranjang <span class="badge rounded-pill bg-danger cart-badge" id="cart-count">0</span>
            </button>
          </div>
        </div>
        
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 g-md-4" id="menu-grid"></div>
      </section>

      <section id="orders" class="view-section">
        <h3 class="fw-bold mb-4 d-none d-lg-block">Antrean Pesanan</h3>
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" style="min-width: 600px;">
              <thead class="table-light">
                <tr>
                  <th class="ps-4 py-3">ID Order</th>
                  <th>Meja</th>
                  <th>Total Tagihan</th>
                  <th>Status</th>
                  <th class="text-center">Aksi Kasir</th>
                </tr>
              </thead>
              <tbody id="orders-table-body"></tbody> 
            </table>
          </div>
        </div>
      </section>

      <section id="tables" class="view-section">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold d-none d-lg-block"><i class="bi bi-layers-half text-warning me-2"></i> Setting Meja</h3>
          <button class="btn btn-dark fw-bold py-2 px-4" data-bs-toggle="modal" data-bs-target="#addTableModal">
            <i class="bi bi-plus-lg me-1"></i> Tambah Meja
          </button>
        </div>
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 g-md-4" id="table-container"></div>
      </section>

    </main>
  </div>

  <div class="modal fade" id="cartModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content border-0 rounded-4 shadow"><div class="modal-header bg-light border-0"><h5 class="fw-bold"><i class="bi bi-cart-check me-2"></i>Keranjang</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><div id="cart-items-list" class="mb-4"></div><div class="mb-3"><label class="form-label fw-bold">Pilih Meja</label><select class="form-select form-select-lg" id="cartTableId" required></select></div><div class="d-flex justify-content-between p-3 bg-light rounded-3"><span class="fw-bold">Total:</span><span class="fw-bold text-success fs-4" id="cartTotalLabel">Rp 0</span></div></div><div class="modal-footer border-0"><button class="btn btn-warning w-100 fw-bold py-3 fs-5" id="btnSubmitOrder">Proses Pesanan</button></div></div></div></div>
  <div class="modal fade" id="addMenuModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 rounded-4 shadow"><form id="addMenuForm"><div class="modal-header bg-light border-0"><h5 class="fw-bold">Tambah Menu</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><div class="mb-3"><label class="fw-bold small">Nama Menu</label><input type="text" class="form-control form-control-lg" id="menuName" required></div><div class="mb-3"><label class="fw-bold small">Kategori</label><select class="form-select form-select-lg" id="menuCategory"><option>Makanan</option><option>Minuman</option></select></div><div class="mb-3"><label class="fw-bold small">Harga (Rp)</label><input type="number" class="form-control form-control-lg" id="menuPrice" required></div><div class="mb-4"><label class="fw-bold small">Foto</label><input type="file" class="form-control form-control-lg" id="menuImage" accept="image/*"></div><button type="submit" class="btn btn-primary w-100 fw-bold py-2">Simpan</button></div></form></div></div></div>
  <div class="modal fade" id="editMenuModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 rounded-4 shadow"><form id="editMenuForm"><div class="modal-header bg-light border-0"><h5 class="fw-bold">Edit Menu</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><input type="hidden" id="editMenuId"><div class="mb-3"><label class="fw-bold small">Nama Menu</label><input type="text" class="form-control form-control-lg" id="editMenuName" required></div><div class="mb-3"><label class="fw-bold small">Kategori</label><select class="form-select form-select-lg" id="editMenuCategory"><option>Makanan</option><option>Minuman</option></select></div><div class="mb-3"><label class="fw-bold small">Harga (Rp)</label><input type="number" class="form-control form-control-lg" id="editMenuPrice" required></div><div class="mb-4"><label class="fw-bold small">Ganti Foto</label><input type="file" class="form-control form-control-lg" id="editMenuImage" accept="image/*"></div><button type="submit" class="btn btn-warning w-100 fw-bold py-2">Update</button></div></form></div></div></div>
  <div class="modal fade" id="addTableModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 rounded-4 shadow"><form id="addTableForm"><div class="modal-header border-0"><h5 class="fw-bold mb-0">Tambah Meja</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><input type="number" class="form-control form-control-lg mb-4" id="tableNumber" placeholder="Nomor Meja" required><button type="submit" class="btn btn-dark w-100 fw-bold py-2">Simpan</button></div></form></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const btnToggle = document.getElementById('btnToggleSidebar');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const navLinks = document.querySelectorAll('.sidebar .nav-link');

    // Buka menu saat tombol hamburger diklik (HP/iPad)
    btnToggle?.addEventListener('click', () => {
      sidebar.classList.add('active-mobile');
      overlay.classList.add('active');
    });

    // Tutup menu saat area layar yang gelap diklik
    overlay?.addEventListener('click', () => {
      sidebar.classList.remove('active-mobile');
      overlay.classList.remove('active');
    });

    // Otomatis tutup menu kiri setelah pengguna mengeklik salah satu halaman
    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        if(window.innerWidth < 992) { // 992px adalah batas layar iPad
          sidebar.classList.remove('active-mobile');
          overlay.classList.remove('active');
        }
      });
    });
  </script>

  <script type="module" src="js/app.js"></script>
  
  <script>
    // Memantau perubahan pada badge keranjang utama dan menyalin angkanya ke badge versi HP
    setInterval(() => {
      const mainBadge = document.getElementById('cart-count');
      const mobileBadge = document.getElementById('cart-count-mobile');
      if(mainBadge && mobileBadge) mobileBadge.innerText = mainBadge.innerText;
    }, 500);
  </script>

</body>
</html>
