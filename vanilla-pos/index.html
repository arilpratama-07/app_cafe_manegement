<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Management POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .sidebar { width: 250px; min-height: 100vh; position: sticky; top: 0; }
    .nav-link { color: rgba(255,255,255,0.7); border-radius: 10px; margin-bottom: 5px; }
    .nav-link.active { background-color: #ffc107 !important; color: #000 !important; font-weight: bold; }
    .nav-link:hover:not(.active) { background-color: rgba(255,255,255,0.1); color: #fff; }
    .menu-card { transition: transform 0.2s; border: none; overflow: hidden; }
    .menu-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
    .img-container { height: 160px; background-color: #e9ecef; }
    .cart-badge { position: absolute; top: -5px; right: -5px; font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="d-flex">
    <nav class="sidebar bg-dark text-white p-3">
      <div class="d-flex align-items-center mb-4 mt-2 px-3">
        <i class="bi bi-cup-hot-fill fs-2 text-warning me-3"></i>
        <div><h5 class="mb-0 fw-bold">MyCafe</h5><small class="text-white-50">Admin Panel</small></div>
      </div>
      <ul class="nav flex-column px-2">
        <li class="nav-item"><a class="nav-link" href="#dashboard" id="nav-dashboard"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#menu" id="nav-menu"><i class="bi bi-grid-fill me-2"></i> Order Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="#orders" id="nav-orders"><i class="bi bi-receipt me-2"></i> Pesanan (Admin)</a></li>
        <li class="nav-item"><a class="nav-link" href="#tables" id="nav-tables"><i class="bi bi-layers-half me-2"></i> Meja</a></li>
      </ul>
    </nav>

    <main class="flex-grow-1 p-4 w-100 vh-100 overflow-auto">
      
      <section id="dashboard" class="view-section">
        <h3 class="fw-bold mb-4">Dashboard</h3>
        <div class="alert alert-warning border-0 shadow-sm rounded-4"><i class="bi bi-info-circle me-2"></i> Selamat datang di MyCafe POS System.</div>
      </section>

      <section id="menu" class="view-section">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold"><i class="bi bi-grid-fill text-warning me-2"></i> Pilih Menu</h3>
          
          <div class="d-flex gap-2">
            <button class="btn btn-outline-dark fw-bold" data-bs-toggle="modal" data-bs-target="#addMenuModal">
              <i class="bi bi-plus-lg"></i> Tambah Menu
            </button>
            <button class="btn btn-warning fw-bold position-relative" id="btnOpenCart">
              <i class="bi bi-cart3 me-1"></i> Keranjang <span class="badge rounded-pill bg-danger cart-badge" id="cart-count">0</span>
            </button>
          </div>
        </div>
        <div class="row g-4" id="menu-grid"></div>
      </section>

      <section id="orders" class="view-section">
  <h3 class="fw-bold mb-4">Antrean Pesanan</h3>
  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th class="ps-4">ID</th>
          <th>Meja</th>
          <th>Total</th>
          <th>Status</th>
          <th class="text-center">Aksi</th>
        </tr>
      </thead>
      <tbody id="orders-table-body"></tbody> </table>
  </div>
</section>
      <section id="tables" class="view-section">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold"><i class="bi bi-layers-half text-warning me-2"></i> Manajemen Meja</h3>
          <button class="btn btn-dark fw-bold" data-bs-toggle="modal" data-bs-target="#addTableModal">Tambah Meja</button>
        </div>
        <div class="row g-4" id="table-container"></div>
      </section>

    </main>
  </div>

  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-md"><div class="modal-content border-0 rounded-4 shadow">
      <div class="modal-header bg-light border-0"><h5 class="fw-bold">Keranjang Pesanan</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-4">
        <div id="cart-items-list" class="mb-4"></div>
        <div class="mb-3">
          <label class="form-label fw-bold">Pilih Meja Pelanggan</label>
          <select class="form-select form-select-lg" id="cartTableId" required></select>
        </div>
        <div class="d-flex justify-content-between p-3 bg-light rounded-3">
          <span class="fw-bold">Total Bayar:</span><span class="fw-bold text-success fs-4" id="cartTotalLabel">Rp 0</span>
        </div>
      </div>
      <div class="modal-footer border-0"><button class="btn btn-warning w-100 fw-bold py-2" id="btnSubmitOrder">Kirim Pesanan ke Admin</button></div>
    </div></div>
  </div>

  <div class="modal fade" id="addMenuModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content border-0 rounded-4 shadow"><form id="addMenuForm">
      <div class="modal-header bg-light border-0"><h5 class="fw-bold">Tambah Menu Baru</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-4">
        <div class="mb-3"><label class="fw-bold small">Nama Menu</label><input type="text" class="form-control form-control-lg" id="menuName" required></div>
        <div class="mb-3"><label class="fw-bold small">Kategori</label><select class="form-select form-select-lg" id="menuCategory"><option value="Makanan">Makanan</option><option value="Minuman">Minuman</option></select></div>
        <div class="mb-3"><label class="fw-bold small">Harga</label><input type="number" class="form-control form-control-lg" id="menuPrice" required></div>
        <div class="mb-4"><label class="fw-bold small">Foto Menu</label><input type="file" class="form-control form-control-lg" id="menuImage" accept="image/*"></div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Simpan Menu</button>
      </div>
  </form></div></div></div>

  <div class="modal fade" id="editMenuModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content border-0 rounded-4 shadow">
        <form id="editMenuForm">
          <div class="modal-header bg-light border-0">
            <h5 class="fw-bold">Edit Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <input type="hidden" id="editMenuId">
            <div class="mb-3"><label class="fw-bold small">Nama Menu</label><input type="text" class="form-control form-control-lg" id="editMenuName" required></div>
            <div class="mb-3"><label class="fw-bold small">Kategori</label><select class="form-select form-select-lg" id="editMenuCategory"><option value="Makanan">Makanan</option><option value="Minuman">Minuman</option></select></div>
            <div class="mb-3"><label class="fw-bold small">Harga</label><input type="number" class="form-control form-control-lg" id="editMenuPrice" required></div>
            <div class="mb-4"><label class="fw-bold small">Ganti Foto Baru (Opsional)</label><input type="file" class="form-control form-control-lg" id="editMenuImage" accept="image/*"></div>
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Update Menu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addTableModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content border-0 rounded-4 shadow"><form id="addTableForm">
    <div class="modal-body p-4">
      <h5 class="fw-bold mb-3">Tambah Meja</h5>
      <input type="number" class="form-control form-control-lg mb-3" id="tableNumber" placeholder="Nomor Meja" required>
      <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Simpan Meja</button>
    </div>
  </form></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
